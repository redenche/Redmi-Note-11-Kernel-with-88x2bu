name: Build NetHunter Kernel with RTL88x2BU
on:
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev bison flex libssl-dev libcrypto++-dev git curl openssl unzip wget

    - name: Download Official AOSP Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        # Скачиваем стабильный официальный Clang r450784d напрямую из коммитов Android Google Git
        wget https://googlesource.com
        tar -xf clang-r450784d.tar.gz
        rm clang-r450784d.tar.gz

    - name: Integrate RTL88x2BU Driver
      run: |
        # Клонируем официальный драйвер RTL88x2BU во временную папку
        git clone https://github.com $GITHUB_WORKSPACE/rtl88x2bu
        
        # Создаем целевую директорию внутри дерева исходников ядра
        mkdir -p drivers/net/wireless/realtek/rtl88x2bu
        
        # Копируем файлы драйвера
        cp -r $GITHUB_WORKSPACE/rtl88x2bu/* drivers/net/wireless/realtek/rtl88x2bu/
        
        # Интегрируем драйвер в общую систему сборки модулей ядра
        echo "obj-\$(CONFIG_RTL8822BU) += rtl88x2bu/" >> drivers/net/wireless/realtek/Makefile
        echo 'source "drivers/net/wireless/realtek/rtl88x2bu/Kconfig"' >> drivers/net/wireless/realtek/Kconfig
        
        # Принудительно активируем драйвер в дефконфиге Redmi Note 11 (spes)
        echo "CONFIG_RTL8822BU=y" >> arch/arm64/configs/spes-perf_defconfig

    - name: Build Kernel
      run: |
        # Добавляем путь к скачанному Clang в системный PATH
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Генерируем конфигурационный файл из дефконфига устройства
        make O=out spes-perf_defconfig
        
        # Запускаем компиляцию ядра на всех доступных потоках процессора
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Package with AnyKernel3
      run: |
        # Скачиваем утилиту AnyKernel3 для запаковки ядра в формат прошивки
        git clone https://github.com $GITHUB_WORKSPACE/AnyKernel3
        
        # Переносим скомпилированное ядро в zip-упаковщик
        cp out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/AnyKernel3/
        cd $GITHUB_WORKSPACE/AnyKernel3
        
        # Отключаем строгую проверку устройства внутри скрипта, чтобы избежать ошибок совместимости имен
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        
        # Архивируем всё в готовый для прошивки ZIP-файл
        zip -r9 $GITHUB_WORKSPACE/NetHunter-Kernel-Spes.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-RTL88x2BU
        path: NetHunter-Kernel-Spes.zip
        
